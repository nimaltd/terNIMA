[package]
name = "ternima-core"
description = "Everything in ternima that does not draw on the screen: transports, sessions, config and parsers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
gimli = { version = "0.34.0", default-features = false, features = ["read", "std"] }
object = { version = "0.39", default-features = false, features = ["read", "std", "compression"] }
probe-rs = "0.32.0"
serde = { version = "1", features = ["derive"] }
serialport = { version = "4.10", features = ["usbportinfo-interface", "usbportinfo-location"] }
toml = "1.1.8"

[dev-dependencies]
gimli = { version = "0.34.0", default-features = false, features = ["read", "std", "write"] }
object = { version = "0.39", default-features = false, features = ["read", "std", "compression", "write"] }
