[workspace]
members = ["crates/ternimal-core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["Nima Askari (NimaLTD) <nima.askari@gmail.com>"]
repository = "https://github.com/nimaltd/ternimal"
homepage = "https://github.com/nimaltd/ternimal"

[profile.release]
codegen-units = 1
lto = true
strip = true
